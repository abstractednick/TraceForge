[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge-cli"
version = "0.1.0"
description = "Validate, analyze, and convert TraceForge JSONL traces"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "TraceForge contributors" }]
dependencies = []

[project.scripts]
traceforge = "traceforge_cli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["traceforge_cli"]
