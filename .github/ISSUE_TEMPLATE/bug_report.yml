name: Bug report
description: Report reproducible incorrect behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Remove secrets and sensitive trace content before submitting.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest reliable sequence of steps.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: TraceForge revision or version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Android version, device/emulator, ABI, build type, JDK/Python, and sanitized options.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or trace excerpt
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed credentials, personal data, and proprietary identifiers.
          required: true
