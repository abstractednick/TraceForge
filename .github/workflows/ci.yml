name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Test Python CLI
        run: |
          python -m pip install --no-deps -e ./traceforge-cli
          python -m unittest discover -s traceforge-cli/tests -v
      - name: Build and test portable native code
        run: |
          cmake -S traceforge-agent -B build/native
          cmake --build build/native --parallel
          ctest --test-dir build/native --output-on-failure
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Run Gradle checks when wrapper is executable
        shell: bash
        run: |
          if [[ -x ./gradlew ]]; then
            ./gradlew build --stacktrace
          else
            echo "No executable Gradle wrapper; skipping Gradle checks."
          fi
